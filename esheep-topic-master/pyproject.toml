[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "esheep-topic-master"
version = "0.1.0"
description = "Topic management system with Web Kanban, Social Favs sync, and CLI/API integration for esheep suite."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "esheep team" }
]
keywords = ["topic-manager", "kanban", "esheep", "content-creation", "ai-agent"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

